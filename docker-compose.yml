version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      --quantization awq
      --max-model-len 32768
      --gpu-memory-utilization 0.90
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  agent-api:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - QDRANT_URL=http://qdrant:6333
      - SEARCH_AGENT_URL=http://search-agent:8082
      - APPLY_AGENT_URL=http://apply-agent:8083
      - SANDBOX_IMAGE=kovanica-sandbox:latest
      - SANDBOX_RUNNER_URL=http://sandbox-runner:8081
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-}
      - REPOS_PATH=/repos/kovanica-protocol
      - AGENT_DB=/data/agent.sqlite3
      - CORS_ORIGINS=${CORS_ORIGINS:-https://kovi.kovanica.online,https://kovanica.online,https://www.kovanica.online}
      - KOVANICA_NODE_URL=${KOVANICA_NODE_URL:-https://explorer.kovanica.online}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-}
      # Optional auth: set AUTH_JWKS_URL (+ ISSUER/AUDIENCE/DEV_ROLES) for
      # JWKS mode, or AUTH_DEV_TOKEN for dev-token mode. Unset = everyone is
      # 'user' (fail-closed for dev).
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-}
      - AUTH_ISSUER=${AUTH_ISSUER:-}
      - AUTH_AUDIENCE=${AUTH_AUDIENCE:-}
      - AUTH_DEV_ROLES=${AUTH_DEV_ROLES:-}
      - AUTH_DEV_TOKEN=${AUTH_DEV_TOKEN:-}
      # Apply -> draft PR path. Fail-closed: unless AGENT_GIT_APPLY_ENABLED=1
      # the apply-agent only validates and reports (dry_run).
      # AGENT_GIT_REPO should point at a read-only clone when the container
      # cannot see the host checkout; set a git/gh identity + gh auth before
      # arming.
      - AGENT_GIT_APPLY_ENABLED=${AGENT_GIT_APPLY_ENABLED:-}
      - AGENT_GIT_DRY_RUN=${AGENT_GIT_DRY_RUN:-1}
      - AGENT_GIT_BASE=${AGENT_GIT_BASE:-main}
      - AGENT_GIT_REPO=${AGENT_GIT_REPO:-/repos/kovanica-protocol}
      - AGENT_GIT_REMOTE=${AGENT_GIT_REMOTE:-origin}
      - AGENT_GH_BIN=${AGENT_GH_BIN:-gh}
    volumes:
      - ./repos:/repos:ro
      - agent-data:/data   # persistent SQLite checkpoint + audit state
      # gh CLI auth for the apply→PR path (AGENT_GIT_APPLY_ENABLED=1).
      # Mounted read-only so the container can create draft PRs using the
      # host's GitHub token without the token living inside the image.
      - /root/.config/gh:/root/.config/gh:ro
    # SECURITY: agent-api does NOT mount /var/run/docker.sock (that would be
    # effective root on the host). Sandbox containers are spawned exclusively
    # by the scoped sandbox-runner sidecar, which agent-api talks to over HTTP
    # (SANDBOX_RUNNER_URL). This keeps the Docker socket on exactly one
    # least-privileged service.
    depends_on:
      - vllm
      - qdrant
      - sandbox-runner
      - search-agent
      - apply-agent
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # search-agent: dedicated semantic-search subagent. Owns Qdrant + the
  # embedder + the two search collections (codebase, skill-docs). The
  # orchestrator (agent-api) calls it over HTTP instead of importing rag.py
  # directly. Internal-only (no host port) — the public surface is the
  # orchestrator's /chat / /confirm, with search folded into answers.
  search-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODULE=embed
    volumes:
      - ./repos:/repos:ro
    depends_on:
      - qdrant
    # internal-only: no host port published
    restart: unless-stopped
    # Run the search-agent service module, not the orchestrator's main:app.
    command: ["uvicorn", "search_agent:app", "--host", "0.0.0.0", "--port", "8082"]

  # apply-agent: dedicated safe-apply subagent. Owns the git worktree/PR
  # path (validate, apply, commit, push, gh draft-PR). Called by the
  # orchestrator on /confirm approval. Internal-only — never exposed to the
  # public internet. Fail-closed behind AGENT_GIT_APPLY_ENABLED=1.
  apply-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - REPOS_PATH=/repos/kovanica-protocol
      - AGENT_GIT_APPLY_ENABLED=${AGENT_GIT_APPLY_ENABLED:-}
      - AGENT_GIT_DRY_RUN=${AGENT_GIT_DRY_RUN:-1}
      - AGENT_GIT_BASE=${AGENT_GIT_BASE:-main}
      - AGENT_GIT_REPO=${AGENT_GIT_REPO:-/repos/kovanica-protocol}
      - AGENT_GIT_REMOTE=${AGENT_GIT_REMOTE:-origin}
      - AGENT_GH_BIN=${AGENT_GH_BIN:-gh}
    volumes:
      - ./repos:/repos:ro
      - /root/.config/gh:/root/.config/gh:ro
    depends_on:
      - sandbox-runner
    # internal-only: no host port published
    restart: unless-stopped
    # Run the apply-agent service module, not the orchestrator's main:app.
    command: ["uvicorn", "apply_agent:app", "--host", "0.0.0.0", "--port", "8083"]

  # sandbox-runner is the ONLY service that mounts the Docker socket. It owns
  # all container spawning and exposes a single restricted endpoint, POST /run
  # (see sandbox/runner/server.py), which re-enforces the cargo whitelist and
  # suspicious-arg filter server-side before spawning the ephemeral,
  # network-disabled sandbox container.
  sandbox-runner:
    build: ./sandbox/runner
    environment:
      - SANDBOX_IMAGE=kovanica-sandbox:latest
      - REPOS_PATH=/repos/kovanica-protocol
      - SANDBOX_RUNNER_HOST=0.0.0.0
      - SANDBOX_RUNNER_PORT=8081
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-}
    volumes:
      # The shared read-only repo mount, so the sidecar can bind it into each
      # sandbox container as /workspace:ro.
      - ./repos:/repos:ro
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp
    read_only: true
    # The runner image drops to a non-root user (sandbox-runner), but the
    # docker.sock it must drive is owned root:docker — add the host docker
    # group via group_add so the socket stays group-accessible without
    # mounting it with a worse mode. Set DOCKER_GID on hosts where the
    # group id differs from the default.
    group_add:
      - "${DOCKER_GID:-988}"
    # privileged: false is the default; kept explicit for clarity — the socket
    # is mounted deliberately, not via broad privileged access.
    privileged: false
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - webui-data:/app/backend/data
    depends_on:
      - vllm
    restart: unless-stopped
    profiles: ["operator"]

  # Not run as a persistent service. Build it once:
  #   docker compose --profile build-only build sandbox-image
  # sandbox-runner then spawns short-lived containers from this image per
  # cargo call via the Docker SDK (see sandbox/runner/server.py: run_cargo).
  #
  # Context is the repo root (one level up from this compose file), not
  # ./sandbox — sandbox/Dockerfile's pre-vendoring step COPYs Cargo.toml
  # and each crate's Cargo.toml from crates/, which only exist at the repo
  # root. `docker compose build` resolves this path relative to this
  # file's directory (kovanica-agent/), so `..` is the protocol repo root.
  # This also means kovanica-agent/ must stay checked out inside the
  # kovanica-protocol repo tree at kovanica-agent/ (as it is here), not
  # moved elsewhere on its own. A standalone kovanica-agent checkout should
  # build the sandbox image with sandbox/build-image.sh instead.
  sandbox-image:
    build:
      context: ..
      dockerfile: kovanica-agent/sandbox/Dockerfile
    image: kovanica-sandbox:latest
    profiles: ["build-only"]

volumes:
  vllm-cache:
  qdrant-data:
  webui-data:
  agent-data:

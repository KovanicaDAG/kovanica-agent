# kovi.kovanica.online — public Kovi chat UI + /chat API.
# Cloudflare is proxied (orange cloud) and talks to origin HTTPS :443
# (Full / Full Strict). A Let's Encrypt cert is already issued for this
# hostname. Port 80 stays up for ACME renewals and Flexible-SSL fallback.
#
# Placeholders __SSL_CERT__ / __SSL_KEY__ are rewritten by deploy/vps-up.sh.

server {
    listen 80;
    listen [::]:80;
    server_name kovi.kovanica.online;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kovi.kovanica.online;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# kovi.kovanica.online — public Kovi chat UI + /chat API.
# Cloudflare terminates TLS in front of this (proxied A record). Origin is HTTP :80.
# Install:
#   cp deploy/nginx-kovi.conf /etc/nginx/sites-available/kovi.kovanica.online
#   ln -sfn /etc/nginx/sites-available/kovi.kovanica.online /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kovi.kovanica.online;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

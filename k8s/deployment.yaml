# Kovanica Agent Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kovanica-agent
  labels:
    app: kovanica-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kovanica-agent
  template:
    metadata:
      labels:
        app: kovanica-agent
    spec:
      containers:
      - name: agent
        image: kovanica/kovanica-agent:latest
        ports:
        - containerPort: 8080
        env:
        - name: PYTHON_VERSION
          value: "3.12"
        - name: AGENT_RATE_LIMIT
          value: "30"
        - name: AGENT_RATE_WINDOW_S
          value: "60"
        - name: LOG_LEVEL
          value: "INFO"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kovanica-secrets
              key: openai-api-key
        - name: AGENT_DEV_TOKEN
          valueFrom:
            secretKeyRef:
              name: kovanica-secrets
              key: dev-token
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kovanica-agent
  labels:
    app: kovanica-agent
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: kovanica-agent
---
apiVersion: v1
kind: Secret
metadata:
  name: kovanica-secrets
type: Opaque
stringData:
  openai-api-key: "your-openai-api-key-here"
  dev-token: "dev-token-123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app: qdrant
spec:
  type: ClusterIP
  ports:
  - port: 6333
    targetPort: 6333
  selector:
    app: qdrant